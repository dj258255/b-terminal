[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["vendor"]

[workspace.package]
version = "0.54.0"
edition = "2024"
rust-version = "1.87"
license = "MIT"
repository = "https://github.com/dj258255/b-terminal"

[workspace.dependencies]
bt-core = { path = "crates/bt-core" }
bt-term = { path = "crates/bt-term" }
bt-render = { path = "crates/bt-render" }
bt-gpu = { path = "crates/bt-gpu" }

anyhow = "1"
thiserror = "2"
log = "0.4"
env_logger = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
dirs = "7"
parking_lot = "0.13"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

[profile.release]
lto = "thin"
codegen-units = 1

# 고쳐 쓰는 외부 크레이트(vendor/README.md): winit(한글 IME), softbuffer(색 공간), alacritty_terminal(글자 묶음 폭), vte(윗줄 SGR 53·55)
[patch.crates-io]
winit = { path = "vendor/winit" }
softbuffer = { path = "vendor/softbuffer" }
alacritty_terminal = { path = "vendor/alacritty_terminal" }
vte = { path = "vendor/vte" }
