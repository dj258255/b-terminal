[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/dj258255/b-terminal"

[workspace.dependencies]
bt-core = { path = "crates/bt-core" }
bt-term = { path = "crates/bt-term" }
bt-render = { path = "crates/bt-render" }
bt-studio = { path = "crates/bt-studio" }

anyhow = "1"
thiserror = "2"
log = "0.4"
env_logger = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
dirs = "7"
parking_lot = "0.13"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
