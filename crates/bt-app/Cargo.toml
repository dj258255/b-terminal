[package]
name = "bt-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "b-terminal"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
arboard = "3"
bt-core = { version = "0.46.0", path = "../bt-core" }
bt-gpu = { version = "0.46.0", path = "../bt-gpu" }
bt-render = { version = "0.46.0", path = "../bt-render" }
bt-term = { version = "0.46.0", path = "../bt-term" }
env_logger.workspace = true
gethostname = "1.1.0"
global-hotkey = "0.9.0"
log.workspace = true
rustix = { version = "1", features = ["process"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
softbuffer = "0.4"
winit = "0.30"

[lints]
workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
muda = "0.19.3"
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSControl", "NSDockTile", "NSEvent", "NSGraphics", "NSImage", "NSImageView", "NSRunningApplication", "NSScreen", "NSSound", "NSView", "NSWindow"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSString"] }
