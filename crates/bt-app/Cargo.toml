[package]
name = "bt-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "b-terminal"
path = "src/main.rs"

[dependencies]
accesskit = "0.25"
# Linux의 accesskit_unix(AT-SPI)는 의존성이 커서 끈다(#560). 끄면 Linux에서는 아무 일도 하지 않는 어댑터가 된다.
accesskit_winit = { version = "0.34", default-features = false, features = ["rwh_06"] }
anyhow.workspace = true
arboard = "3"
bt-core = { version = "0.106.0", path = "../bt-core" }
bt-gpu = { version = "0.106.0", path = "../bt-gpu" }
bt-render = { version = "0.106.0", path = "../bt-render" }
bt-term = { version = "0.106.0", path = "../bt-term" }
env_logger.workspace = true
gethostname = "1.1.0"
global-hotkey = "0.9.0"
log.workspace = true
rustix = { version = "1", features = ["process", "stdio", "termios"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
# `+list-themes` 대화형 화면이 SIGTERM·SIGHUP에도 터미널을 되돌리려고(안전한 flag 등록만 쓴다). alacritty_terminal이 이미 같은 판을 쓴다
signal-hook = "0.4"
softbuffer = "0.4"
winit = "0.30"

[dev-dependencies]
# 만든 트리를 화면 읽기 프로그램 쪽(어댑터가 쓰는 소비자)이 그대로 받아 글·선택을 읽는지 시험한다(#560)
accesskit_consumer = "0.39"

[lints]
workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
muda = "0.19.3"
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSControl", "NSDockTile", "NSEvent", "NSGraphics", "NSImage", "NSImageView", "NSProgressIndicator", "NSRunningApplication", "NSScreen", "NSSound", "NSResponder", "NSView", "NSWindow", "NSWorkspace", "block2", "objc2-uniform-type-identifiers"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSAttributedString", "NSError", "NSGeometry", "NSString", "NSURL", "NSUserDefaults"] }
objc2-uniform-type-identifiers = { version = "0.3.2", default-features = false, features = ["std", "UTType"] }
block2 = "0.6"
