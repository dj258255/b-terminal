[package]
name = "bt-term"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
alacritty_terminal = "0.26"
anyhow.workspace = true
bt-core = { version = "0.42.0", path = "../bt-core" }
log.workspace = true
miniz_oxide = "0.8"
parking_lot.workspace = true
png = "0.17"
portable-pty = "0.9"

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.27.0"

[target.'cfg(unix)'.dependencies]
# portable-pty가 이미 쓰는 판(Cargo.lock의 nix 0.28). `MasterPty::get_termios`가 돌려주는 타입을 이름으로 쓰려고 직접 기댄다(#258)
nix = { version = "0.28", default-features = false, features = ["term"] }

[target.'cfg(target_os = "macos")'.dependencies]
libproc = "0.15"
